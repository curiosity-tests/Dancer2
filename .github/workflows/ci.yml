name: CI

on:
  push:
    branches: '**'
  pull_request:
    branches: '**'
  schedule:
  - cron: '42 5 * * *'
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

# A new push to a branch supersedes any run still going on that branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.leg || 'push' }}-${{ inputs.racecar_run }}
  cancel-in-progress: false

# Build and test Dancer on several versions of Perl using an image that already has a lot of modules installed.
# This will provide a fast feedback if a commit broke anything in the unit-tests.
# Using 5.32 we also create the tar.gz file and save it as an artifact.
#
# Once this job passed we launch several jobs in parallel
# 1) Verify that we can install the created distribution on many versions of Perl using a Linux Docker image with vanilla Perl.
# 2) Verify that we can install the created distribution on native Linux/Windows/OSX.
# 3) Verify that a mumber of plugins and other distributions that depend on Dancer, that the new version won't break them.

# We run the job on every push and every pull-request.
# We also run them periodically to makes sure none changes in dependencies of Dancer don't break it even during the days when the
#    Dancer developers rest.

permissions:
  contents: read
  id-token: write

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}

run-name: "CI ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

jobs:
  build-in-container:
    if: ${{ github.repository == 'PerlDancer/Dancer2' || 'push' != 'schedule' }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        perl-version:
        - 'latest'
        - '5.40'
        - '5.36-bookworm'

    container:
      image: perldocker/perl-tester:${{ matrix.perl-version }}     # https://hub.docker.com/r/perldocker/perl-tester

    name: Build on Linux with Perl ${{ matrix.perl-version }}
    steps:
    - name: Install curl/bash for action-checkout (racecar; ungated, both arms)
      shell: sh
        # Best-effort probe, never a gate. Inside a container job running as a
        # non-root user, apt-get cannot write /var/lib/apt/lists and exits 100,
        # which failed ardupilot's build job at step 3 before any of its own work
        # ran. GitHub uses `sh -e`, so a failing command aborts the script and a
        # trailing `exit 0` would never be reached -- hence `|| true` per branch
        # plus continue-on-error. If curl/bash are genuinely missing,
        # action-checkout fails next with a message that names the real problem.
      continue-on-error: true
      run: |
        command -v curl >/dev/null 2>&1 && command -v bash >/dev/null 2>&1 && exit 0
        SUDO=
        if [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null 2>&1; then SUDO=sudo; fi
        if command -v apt-get >/dev/null 2>&1; then
          { $SUDO apt-get update -qq && DEBIAN_FRONTEND=noninteractive $SUDO apt-get install -y -qq curl ca-certificates bash; } || true
        elif command -v apk >/dev/null 2>&1; then $SUDO apk add --no-cache curl ca-certificates bash || true
        elif command -v dnf >/dev/null 2>&1; then $SUDO dnf install -y curl ca-certificates bash || true
        elif command -v yum >/dev/null 2>&1; then $SUDO yum install -y curl ca-certificates bash || true
        elif command -v zypper >/dev/null 2>&1; then $SUDO zypper -n install curl ca-certificates bash || true
        fi
        exit 0

    - name: Checkout code
      uses: crashappsec/action-checkout@e9ff46a65f6403d9d88b87d248c3dfa41550ec75
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
    - name: Install dependencies
      run: |
        perl -v
        cpanm --notest --force Module::Pluggable

        # HTTP::XSCookies omits Date::Parse from TEST_REQUIRES in its
        # Makefile.PL, so its `make test` fails on any perl that doesn't
        # already have TimeDate installed. Remove once upstream ships a fix.
        cpanm --notest Date::Parse

        dzil authordeps --missing | cpanm --notest

        # HTTP::XSCookies (optional) does not compile on perl 5.44+: its
        # Makefile.PL forces -std=c89, which perl's headers no longer
        # accept. Fix submitted upstream at <PR URL>. Dancer2 falls back
        # to its pure-Perl cookie path without it. Remove this filter
        # once a fixed release is on CPAN.
        dzil listdeps --author --missing \
          | grep -v '^HTTP::XSCookies$' \
          | cpanm --notest

    - name: Regular tests
      run: |
        dzil test --author --release


      # test t/issues/gh-811.t depends on Dancer2::Session::Cookie so it is skipped the first time
      # but it feel cleaner to run the tests once before we install Dancer
    - name: Install Extra dependencies
      run: |
        cpanm --notest Dancer2::Session::Cookie

    - name: Full test cycle
      run: |
        dzil test --author --release

    - name: Create release
      if: ${{ matrix.perl-version == 'latest' }}
      run: |
        # Increase the version number by 0.000001 so in the reports we can be sure we are using the code to be released.
        perl -i -p -e 's/^version\s*=\s*(\d+\.\d+)/"version = " . ($1 + 0.000001)/e' dist.ini
        dzil build

    - name: Archive artifacts
      if: ${{ matrix.perl-version == 'latest' }}
      uses: actions/upload-artifact@v7
      with:
        name: the-dancer
        path: |
          Dancer2-*.tar.gz


    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
        obs="${home}/observables"
        fail=0

        echo "::group::curiosity layout"
        echo "CURIOSITY_ROOT=${root:-<unset>}"
        echo "CURIOSITY_HOME=${home}"
        ls -la "${obs}" 2>/dev/null || echo "no observables dir at ${obs}"
        echo "::endgroup::"

        # Observables for THIS run+attempt. The prefix matters: a stale file from an
        # earlier run on the same mount would otherwise pass.
        prefix="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
        shopt -s nullglob
        mine=("${obs}/${prefix}"*)
        if [ ${#mine[@]} -eq 0 ]; then
          mine=("${obs}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-observables"*)
        fi
        if [ ${#mine[@]} -eq 0 ]; then
          echo "::error::no observables for run ${prefix} in ${obs} - instrumentation produced nothing"
          fail=1
        else
          echo "observables present: ${#mine[@]} file(s)"
          printf '  %s\n' "${mine[@]}"
        fi

        for f in "${mine[@]}"; do
          case "$f" in
            *.jsonl|*.json|*.combined)
              if ! jq --slurp "." "$f" > /dev/null 2>&1; then
                echo "::error::observables do not parse: $f"
                fail=1
              fi
              ;;
          esac
        done

        # Crash thresholds copied from check-run: a few null frames are noise, more than
        # five is a stack walk into nothing.
        for f in "${root}"/log/co-host*.log "${home}"/log/co-host*.log; do
          [ -f "$f" ] || continue
          echo "Asserting that there is no crash in $f"
          if [ "$(grep -c 'p 00000000' "$f" 2>/dev/null || echo 0)" -gt 5 ] \
            || [ "$(grep -E -c 'FATAL: Uncaught signal|Address not mapped at|RAX 0x.*RBX 0x' "$f" 2>/dev/null || echo 0)" -gt 1 ]; then
            echo "::error::crash signature in $f"
            grep -E 'FATAL: Uncaught signal|Address not mapped at' "$f" | head -5 || true
            fail=1
          fi
        done

        cores=("${root}"/coredump.* "${home}"/coredump.*)
        if [ ${#cores[@]} -gt 0 ]; then
          echo "::error::coredump present: ${cores[*]}"
          fail=1
        fi

        for f in "${root}"/runc.log "${root}"/runc.global.log \
                 "${home}"/runc.log "${home}"/runc.global.log; do
          [ -f "$f" ] || continue
          if grep -q '^E:' "$f"; then
            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
